version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: interakt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: interakt
      POSTGRES_PASSWORD: interakt_pass
      POSTGRES_DB: interakt_db
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U interakt']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: interakt_redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: interakt_minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  # Email testing UI — view sent emails at http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: interakt_mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI

volumes:
  postgres_data:
  redis_data:
  minio_data:
